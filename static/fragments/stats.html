<div class="center">
  <h1>Results</h1>

  <div style="display:flex; gap:40px; justify-content:center; margin:20px 0;">
    <div>Total time : <strong id="stat-total-time"></strong></div>
    <div>Accuracy : <strong id="stat-accuracy"></strong></div>
  </div>

  <div style="display:flex; gap:40px; justify-content:center; margin-bottom:20px;">
    <div>Fastest : <strong id="stat-fastest"></strong></div>
    <div>Slowest : <strong id="stat-slowest"></strong></div>
  </div>

  <div id="stat-rows" style="display:grid; grid-template-columns: 1fr auto auto; gap:6px 20px; max-width:500px; margin:0 auto 30px;">
  </div>

  <div style="display:flex; justify-content:center;">
    <button onclick="button_click('stats', 'back', null)">back to menu</button>
  </div>
</div>
